name: happy-commit
on:
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  happy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: happy
    continue-on-error: true
    steps:
      - uses: kitsuyui/happy-commit@5723d586c8ddb4908f77601aa0bb86d08f7283f5 # v0.10.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
